server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # 127.0.0.11 es el DNS embebido de Docker. Con una variable, nginx
    # vuelve a resolver el nombre "backend" y no se queda con la IP del arranque.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_backend backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
