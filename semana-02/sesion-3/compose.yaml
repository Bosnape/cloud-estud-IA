# Demo sesión 3. Un solo `docker compose up --build` levanta los tres.
# El nombre del proyecto fija redes y volumen, da igual desde qué carpeta se invoque.

name: estudia-sesion3

services:
  frontend:
    image: nginx:1.28.3-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    networks:
      - frontal
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    volumes:
      - ./frontend/html:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    networks:
      - frontal
      - datos
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:?Copia .env.example a .env}
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:?Copia .env.example a .env}
      POSTGRES_USER: ${POSTGRES_USER:?Copia .env.example a .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copia .env.example a .env}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  db:
    image: postgres:17.12-alpine@sha256:a77aa70e641402a21411b92b721c58d10f23b50ae5fdd2333efd22d166e1e5f7
    # Solo en la red "datos". No hay `ports`: desde el host y desde el frontend no se llega.
    networks:
      - datos
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Copia .env.example a .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copia .env.example a .env}
      POSTGRES_DB: ${POSTGRES_DB:?Copia .env.example a .env}
    volumes:
      - datos_postgres:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

networks:
  frontal:
  datos:

volumes:
  datos_postgres:
