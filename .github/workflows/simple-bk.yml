name: simple-bk

on:
  push:
    paths:
      - "semana-02/ejercicio/simple_bk/**"
      - ".github/workflows/simple-bk.yml"
  pull_request:
    paths:
      - "semana-02/ejercicio/simple_bk/**"
      - ".github/workflows/simple-bk.yml"

permissions:
  contents: read

jobs:
  test:
    name: Tests de simple_bk
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: semana-02/ejercicio/simple_bk
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Instalar uv y Python 3.12
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: uv sync --locked --group dev

      - name: Correr tests
        run: uv run --group dev pytest -v
